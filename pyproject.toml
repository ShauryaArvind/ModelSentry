[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "modelsentry"
version = "2.0.0"
description = "Enterprise static security scanner for machine learning model artifacts (.pkl, .pt, .h5, .safetensors, .gguf, .onnx, .npy, .npz)"
readme = "README.md"
requires-python = ">=3.8"
license = { text = "MIT" }
authors = [
  { name = "Shaurya Arvind", email = "shauryarvind17@gmail.com" }
]
classifiers = [
    "Development Status :: 5 - Production/Stable",
    "Intended Audience :: Developers",
    "Intended Audience :: Information Technology",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Topic :: Security",
    "Topic :: Scientific/Engineering :: Artificial Intelligence"
]
dependencies = [
    "h5py",
    "rich",
    "pytest",
    "safetensors"
]

[project.scripts]
modelsentry = "modelsentry:main"

[tool.setuptools]
py-modules = ["modelsentry", "scanner"]
